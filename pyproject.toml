[project]
name = "cortexot"
version = "0.3.1"
description = "CortexOT — Industrial AI Advisor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.28.0",
    "asyncua>=1.1.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "import-linter>=2.1",
]

[project.scripts]
cortexot-simulator = "simulator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp", "simulator", "cortexot_plant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: tests that require OPC-UA or Docker stack",
]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Domain stays free of frameworks and adapters"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.db",
    "app.opcua",
    "app.api",
    "app.workers",
    "simulator",
    "fastapi",
    "sqlalchemy",
    "asyncua",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "Services orchestrate domain only"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = [
    "app.db",
    "app.opcua",
    "app.api",
    "app.workers",
    "simulator",
    "fastapi",
    "sqlalchemy",
    "asyncua",
    "httpx",
]
